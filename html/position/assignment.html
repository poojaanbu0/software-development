<!DOCTYPE html>
<html>
    <head>
        <title>design</title>
        <style>
body{
    margin:0;
}

.container{
    width:100vw;
    height:100vh;
    background:#F4B247;
    position:relative;
}
.neck{
    width:400px;
    height:40px;
    background:#1F4B4A;
    position:absolute;
    left:330px;
    top:280px;
}
.body-big{
    width:240px;
    height:240px;
    border-radius:50%;
    background:#A58A36;
    position:absolute;
    left:90px;
    top:160px;
}
.body-small{
    width:200px;
    height:200px;
    border-radius:50%;
    background:#A58A36;
    position:absolute;
    left:240px;
    top:180px;
}
.hole{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#F4B247;
    display:flex;
    justify-content:center;
    align-items:center;

    position:absolute;
    left:280px;
    top:230px;
}

.inside{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#1F4B4A;
}
.mark{
    width:20px;
    height:80px;
    border-radius:10px;
    background:#1F4B4A;

    position:absolute;
    left:170px;
    top:230px;
}
.head{
    width:80px;
    height:60px;
    border-radius:18px;
    background:#A58A36;

    position:absolute;
    left:630px;
    top:270px;
}
.string{
    width:40px;
    height:8px;
    background:#1F4B4A;
    border-radius:5px;

    position:absolute;
    left:650px;
}

.s1{
    top: 280px;
}

.s2{
    top:305px;
}


        </style>
    </head>
    <body>

<div class="container">

    <div class="neck"></div>

    <div class="body-big"></div>

    <div class="body-small"></div>

    <div class="hole">
        <div class="inside"></div>
    </div>

    <div class="mark"></div>

    <div class="head"></div>

    <div class="string s1"></div>
    <div class="string s2"></div>

</div>
    </body>
</html
