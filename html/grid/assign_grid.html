<!DOCTYPE html>
<html>
    <head>
        <title>Grid_resize</title>
        <style>
            .container{
                display: grid;
                grid-template-areas: 
                'one one two'
                'three three three'
                'four five six';

                background-color: blue;
                padding: 10px;
                gap: 5px;
            }
         
            .container div{
                 background-color: white;
                 padding: 10px;
                 text-align: center;
                 border: 1px solid black;
                 
            }
    
            .item1{grid-area:one;}
            .item2{grid-area:two;}
            .item3{grid-area:three;}
            .item4{grid-area:four;}
            .item5{grid-area:five;}
            .item6{grid-area:six;}
            
        </style>
    </head>
    <body>
        <div class = 'container'>
           <div class="item1">1</div>
           <div class="item2">2</div>
           <div class="item3">3</div>
           <div class="item4">4</div>
           <div class="item5">5</div>
           <div class="item6">6</div>
        </div>
    </body>
</html>
