<!DOCTYPE html>
<html>
<head>
    <title>FLEX</title>
<style>
  * {
      box-sizing: border-box;
  }

.container 
{
  display: flex;
  flex-wrap: wrap;
  background-color: DodgerBlue;
  width: 1200px;
  gap: 5px;
  padding: 10px;

}

.container div {
  background-color: #f1f1f1;
  text-align: center;  
  font-size: 30px;
}

.item1
{
  flex: 0 1 calc(50% - 6px);
}
.item2
{
 flex: 0 1 calc(50% - 4px);
}
.item3{
 flex: 0 0 100% ;
}
.item4, .item5, .item6{
   flex: 0 0 calc(33.33% - 4px);
}
@media(max-width: 998px){
  .container 
  {
    width: 100%;
  }
  .item1{
    flex: 100%;
  }
  .item2{
    flex: 100%;
  }
}
@media(max-width: 600px){
  .container 
  {
    width: 100%;
  }
  .item4, .item5, .item6
  { 
    flex: 100%;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class = "item1">1</div>
  <div  class = "item2">2</div>
  <div  class = "item3"> 3</div>  
  <div class = "item4" >4</div>
  <div  class = "item5">5</div>
  <div  class = "item6">6</div>
</div>

</body>
</html>
