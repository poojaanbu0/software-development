<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Fetch API</h1>
<h2>Fetching in Parallel</h2>

<p id="demo"></p>

<script>
// Async function to download files
async function loadData(){
    const[customerResponse, productsResponse, newsResponse] = await Promise.all([
        fetch("customer.json"),
        fetch("products.json"),
        fetch("news.json")
    ]);

  const customer = await customerResponse.json();
  const pro = await productsResponse.json();
  const news = await newsResponse.json();
  myDisplayer("Custome name: " + customer.name);
  myDisplayer(pro.length + " products");
  myDisplayer(news.length + " news items");
}

// Call the async function
loadData();

// Function to display any text
function myDisplayer(text) {
  document.getElementById("demo").innerHTML += text + "<br>";
}
</script>

</body>
</html>
