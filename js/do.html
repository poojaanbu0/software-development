<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>task</h1>

    <div id = "square" style = "background-color: red;width: 100px;height: 100px;" ></div>
    <br>
    <button id = "button">click me</button>
    <script>
            let bttn = document.getElementById("button");
            let msquare = document.getElementById("square");
            

            bttn.addEventListener("click",function() {

                if (msquare.style.borderRadius === "50%"){
                    msquare.style.borderRadius = "0%";
            }
        else{
            msquare.style.borderRadius = "50%";
        }
    })

    
    </script>
</body>
</html>
